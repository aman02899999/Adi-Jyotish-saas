# Firebase App Hosting build/run configuration.
# Docs: https://firebase.google.com/docs/app-hosting/configure
#
# One-time setup (Firebase Console, not this file):
#   1. Firebase Console → Build → App Hosting → Create backend.
#   2. Connect this GitHub repo and pick the branch to deploy
#      (e.g. main, or claude/website-saas-conversion-0agq71 for a preview backend).
#   3. For every entry below marked `secret:`, create the secret first:
#        firebase apphosting:secrets:set SECRET_NAME
#      then grant the backend access when prompted (or via
#        firebase apphosting:secrets:grantaccess SECRET_NAME --backend=<backend-id>
#      ).
#   4. Optional integrations not listed below (Razorpay live keys, Turnstile,
#      Sentry, a custom NEXT_PUBLIC_SITE_URL, etc.) can be added the same way
#      once you have real values — every one of them is optional and the app
#      gracefully disables the feature when unset, matching .env.example.
#   5. Every `secret:` entry below needs Secret Manager Secret Accessor
#      granted to firebase-app-hosting-compute@<project>.iam.gserviceaccount.com
#      for the *build* to even start (App Hosting resolves all secrets at
#      the preparer step, not just the ones marked RUNTIME).

runConfig:
  minInstances: 0
  maxInstances: 3
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # ── Razorpay payments ─────────────────────────────────────────────
  - variable: RAZORPAY_MODE
    value: "test"
    availability:
      - RUNTIME
  - variable: RAZORPAY_TEST_KEY_SECRET
    secret: RAZORPAY_TEST_KEY_SECRET
    availability:
      - RUNTIME
  - variable: RAZORPAY_LIVE_KEY_SECRET
    secret: RAZORPAY_LIVE_KEY_SECRET
    availability:
      - RUNTIME
  - variable: RAZORPAY_WEBHOOK_SECRET
    secret: RAZORPAY_WEBHOOK_SECRET
    availability:
      - RUNTIME

  # ── Practitioner payout bank/UPI encryption ──────────────────────
  - variable: PAYOUT_ENCRYPTION_KEY
    secret: PAYOUT_ENCRYPTION_KEY
    availability:
      - RUNTIME

  # ── Transactional email (Resend) ─────────────────────────────────
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME
  - variable: RESEND_FROM_EMAIL
    value: "Jyotish Studio <onboarding@resend.dev>"
    availability:
      - RUNTIME

  # ── AI readings (Google Gemini) ───────────────────────────────────
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME

  # ── Realtime chat (Ably) ──────────────────────────────────────────
  - variable: ABLY_API_KEY
    secret: ABLY_API_KEY
    availability:
      - RUNTIME

  # ── Firebase Google sign-in ───────────────────────────────────────
  # Client config is public by design (Firebase secures access via Security
  # Rules/authorized domains, not secrecy) — safe to commit.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyA1Pbcaa7D2_JhOo7Qs3bkw5OTkvy4Gdtw"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "ask-astrologer-2c5b5.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "ask-astrologer-2c5b5"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:473989526170:web:a8bbdefc0a46c6c3e12523"
    availability:
      - BUILD
      - RUNTIME
  # Server-side service account JSON — a real secret, never paste it in chat.
  # Get it from Firebase Console → Project Settings → Service Accounts →
  # Generate new private key, then: firebase apphosting:secrets:set FIREBASE_SERVICE_ACCOUNT_KEY
  - variable: FIREBASE_SERVICE_ACCOUNT_KEY
    secret: FIREBASE_SERVICE_ACCOUNT_KEY
    availability:
      - RUNTIME

  # ── Analytics (Google Analytics) ──────────────────────────────────
  # measurementId from the Firebase web config doubles as the GA4 ID.
  - variable: NEXT_PUBLIC_GA_ID
    value: "G-61D4BLFYET"
    availability:
      - BUILD
      - RUNTIME
