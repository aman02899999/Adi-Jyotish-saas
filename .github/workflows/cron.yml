name: Scheduled checks

on:
  schedule:
    # Every 15 minutes.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  # Synthetic uptime check for the handful of routes real money actually flows through — a failed
  # GitHub Actions run here (visible in the Actions tab, and emailable via GitHub's own workflow-
  # failure notifications) is the cheapest possible "is the site actually up" alarm, with no new
  # secrets beyond the SITE_URL this workflow already requires.
  uptime:
    runs-on: ubuntu-latest
    steps:
      - name: Check critical routes are reachable
        run: |
          if [ -z "${{ secrets.SITE_URL }}" ]; then
            echo "SITE_URL repo secret not set — skipping (nothing to check yet)."
            exit 0
          fi
          failed=0
          for path in "/" "/pricing" "/book" "/astrologers"; do
            status=$(curl -sS -o /dev/null -w "%{http_code}" "${{ secrets.SITE_URL }}$path")
            echo "$path -> $status"
            if [ "$status" -ge 400 ]; then
              echo "::error::$path returned $status"
              failed=1
            fi
          done
          exit $failed

  # Pre-session reminders (the FAQ promises one). The route claims each booking before sending,
  # so a run that overlaps the previous one, or a manual re-run, cannot remind anyone twice.
  booking-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Send due booking reminders
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL or CRON_SECRET repo secret not set — skipping."
            exit 0
          fi
          curl -sS --fail-with-body --max-time 120 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/booking-reminders"
