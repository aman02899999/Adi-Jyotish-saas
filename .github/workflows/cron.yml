name: Scheduled housekeeping

on:
  schedule:
    # Every 15 minutes. Expires stale instant-chat wallet holds and abandoned gemstone pending
    # orders — previously these only ran lazily when a user happened to hit a related endpoint.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  housekeeping:
    runs-on: ubuntu-latest
    steps:
      - name: Call housekeeping endpoint
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ] || [ -z "${{ secrets.SITE_URL }}" ]; then
            echo "CRON_SECRET or SITE_URL repo secret not set — skipping (nothing to call yet)."
            exit 0
          fi
          status=$(curl -sS -o response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/housekeeping")
          cat response.json
          if [ "$status" -ge 300 ]; then
            echo "Housekeeping call failed with status $status"
            exit 1
          fi

  # Synthetic uptime check for the handful of routes real money actually flows through — a failed
  # GitHub Actions run here (visible in the Actions tab, and emailable via GitHub's own workflow-
  # failure notifications) is the cheapest possible "is the site actually up" alarm, with no new
  # secrets beyond the SITE_URL this workflow already requires.
  uptime:
    runs-on: ubuntu-latest
    steps:
      - name: Check critical routes are reachable
        run: |
          if [ -z "${{ secrets.SITE_URL }}" ]; then
            echo "SITE_URL repo secret not set — skipping (nothing to check yet)."
            exit 0
          fi
          failed=0
          for path in "/" "/pricing" "/book" "/astrologers"; do
            status=$(curl -sS -o /dev/null -w "%{http_code}" "${{ secrets.SITE_URL }}$path")
            echo "$path -> $status"
            if [ "$status" -ge 400 ]; then
              echo "::error::$path returned $status"
              failed=1
            fi
          done
          exit $failed
