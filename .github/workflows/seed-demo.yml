name: Seed demo accounts

on:
  workflow_dispatch: {}

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Apply pending migrations
        run: |
          for f in drizzle/0001_membership_plans_subscriptions.sql \
                   drizzle/0002_practitioner_photo_url.sql \
                   drizzle/0003_wallet_and_chat.sql \
                   drizzle/0004_default_currency_inr.sql \
                   drizzle/0005_realistic_inr_defaults.sql \
                   drizzle/0006_ai_readings.sql; do
            echo "Applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run seed:demo
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
