name: Seed demo accounts

on:
  workflow_dispatch: {}

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Debug - inspect database state
        run: |
          echo "--- public tables ---"
          psql "$DATABASE_URL" -c "\dt public.*"
          echo "--- drizzle migrations tracking table ---"
          psql "$DATABASE_URL" -c "SELECT * FROM drizzle.__drizzle_migrations ORDER BY id;" || echo "(no drizzle.__drizzle_migrations table)"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npx drizzle-kit migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run seed:demo
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
