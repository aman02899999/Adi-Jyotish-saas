name: Apply a single migration

on:
  workflow_dispatch:
    inputs:
      file:
        description: "Path to the migration SQL file to apply (e.g. drizzle/0006_ai_readings.sql)"
        required: true
        type: string

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration
        run: |
          echo "Applying ${{ inputs.file }}"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "${{ inputs.file }}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
