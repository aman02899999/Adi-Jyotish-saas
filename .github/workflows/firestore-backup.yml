name: Scheduled Firestore backup

on:
  schedule:
    # Daily at 03:00 UTC — outside normal traffic hours for this studio's timezone.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check backup secrets are configured
        id: check
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIRESTORE_BACKUP_BUCKET: ${{ secrets.FIRESTORE_BACKUP_BUCKET }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] || [ -z "$FIREBASE_PROJECT_ID" ] || [ -z "$FIRESTORE_BACKUP_BUCKET" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT, FIREBASE_PROJECT_ID, or FIRESTORE_BACKUP_BUCKET repo secret not set — skipping (nothing to back up to yet)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Reuses the same FIREBASE_SERVICE_ACCOUNT key already configured for firestore-deploy.yml —
      # that service account additionally needs the "Cloud Datastore Import Export Admin" IAM role
      # (roles/datastore.importExportAdmin) for this export to succeed, and the target bucket
      # (FIRESTORE_BACKUP_BUCKET, just the bucket name — no gs:// prefix, no trailing slash) must
      # exist in the same GCP project with that service account granted write access.
      - name: Authenticate to Google Cloud
        if: steps.check.outputs.ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: steps.check.outputs.ready == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Export Firestore to Cloud Storage
        if: steps.check.outputs.ready == 'true'
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIRESTORE_BACKUP_BUCKET: ${{ secrets.FIRESTORE_BACKUP_BUCKET }}
        run: |
          export_path="gs://$FIRESTORE_BACKUP_BUCKET/firestore-backups/$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          gcloud firestore export "$export_path" --project="$FIREBASE_PROJECT_ID"
          echo "Exported Firestore to $export_path"
